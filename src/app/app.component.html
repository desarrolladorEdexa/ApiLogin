<div class="container d-flex justify-content-center align-items-center min-vh-100 position-relative">

  <div class="bg-image"></div>


  <div class="card shadow-lg p-4 rounded-4 flip-card" [class.flipped]="flip" style="width: 350px; min-height: 450px;">


    <div class="front">
      <h2 class="mb-4">Validar Cédula</h2>

      <div class="cedula-container mb-3" style="max-width: 320px;">
        <span class="cedula-icon">
          <i class="bi bi-person-badge-fill"></i>
        </span>
        <input type="text" class="cedula-input" [(ngModel)]="cedula" placeholder="Ingrese su cédula"
          aria-label="Cédula" />
      </div>



      <button class="btn btn-primary w-100 mb-3" style="max-width: 300px;" (click)="validarCedula()">Validar</button>

      <p *ngIf="mensajeError" class="text-danger">{{ mensajeError }}</p>

      <div *ngIf="usuarioEncontrado" class="text-center mt-3" style="max-width: 320px;">
        <p><strong>Nombre:</strong> {{ datosUsuario.nombre }}</p>
        <p><strong>Teléfono:</strong> {{ datosUsuario.telefono }}</p>
        <p><strong>Ciudad:</strong> {{ datosUsuario.ciudad }}</p>
        <img *ngIf="datosUsuario.foto" [src]="datosUsuario.foto" alt="Foto del usuario"
          class="img-thumbnail rounded-circle mb-3" style="width: 100px; height: 100px; object-fit: cover;" />
        <p class="text-success">Usuario encontrado. Puedes continuar con el proceso.</p>
      </div>
    </div>


    <div class="back">
      <h2 class="mb-4" style="margin-top: 7rem;">Formulario de Registro</h2>

      <div class="form-group mb-3">
        <label class="form-label visually-hidden" for="nombreInput">Nombre completo</label>
        <div class="input-icon">
          <i class="bi bi-person-fill"></i>
          <input id="nombreInput" type="text" class="input-icon-input" [(ngModel)]="datosUsuario.nombre"
            placeholder="Nombre completo" />
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label visually-hidden" for="telefonoInput">Número de teléfono</label>
        <div class="input-icon">
          <i class="bi bi-telephone-fill"></i>
          <input id="telefonoInput" type="tel" class="input-icon-input" [(ngModel)]="datosUsuario.telefono"
            placeholder="Número de teléfono" />
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label visually-hidden" for="ciudadSelect">Ciudad</label>
        <div class="input-icon">
          <i class="bi bi-geo-alt-fill"></i>
          <select id="ciudadSelect" class="input-icon-select" [(ngModel)]="ciudad">
            <option value="" disabled>Seleccione una ciudad</option>
            <option value="Cali">Cali</option>
            <option value="Bogotá">Bogotá</option>
            <option value="Medellín">Medellín</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div *ngIf="ciudad === 'Otro'" class="form-group mb-3">
        <label class="form-label visually-hidden" for="otraCiudadInput">Otra ciudad</label>
        <div class="input-icon">
          <i class="bi bi-building"></i>
          <input id="otraCiudadInput" type="text" class="input-icon-input" [(ngModel)]="otraCiudad"
            placeholder="Ingrese su ciudad" />
        </div>
      </div>

      <div class="form-group mb-4">
        <label class="form-label visually-hidden" for="fotoInput">Foto</label>
        <input id="fotoInput" type="file" class="form-control" (change)="onFotoSeleccionada($event)" />
      </div>

      <div *ngIf="fotoPreview" class="text-center mb-3">
        <img [src]="fotoPreview" alt="Vista previa de la foto" class="img-thumbnail rounded shadow-sm"
          style="max-height: 150px; object-fit: cover;" />
      </div>

      <button class="btn btn-success w-100 shadow-sm" (click)="registrar()">Registrar</button>

      <p *ngIf="mensajeError" class="text-danger mt-3">{{ mensajeError }}</p>
    </div>

  </div>
</div>
